# ASH xTB/ORCA Workflow Configuration
# Usage: python ash_xtb_explicit_workflow_smoketest.py --config this_file.yaml
# All parameters must be specified in this config file (command-line parameter override is not supported)

# Input files
inputs:
  reactant: "xyz/reactant.xyz"
  product: "xyz/product.xyz"
  ts_guess: "xyz/ts_ini.xyz"

# System properties
system:
  charge: 0
  mult: 1
  temperature: 298.15  # Temperature in Kelvin for thermochemistry calculations
  pressure: 1.0        # Pressure in atm for thermochemistry calculations

# ============================================================================
# Theory Settings - Two independent theory levels
# ============================================================================

# Main theory: Used for opt_reactant, opt_product, tsopt, numfreq, irc,
#              opt_irc_forward, opt_irc_backward, freq_irc_forward, freq_irc_backward
# IMPORTANT: All these stages MUST use the same theory level for consistency
main_theory:
  type: "xtb"  # xtb or orca
  numcores: 1   # Number of cores for parallelization
  printlevel: 1

  # xTB settings (only used when type=xtb)
  xtb:
    method: "GFN2"        # GFN1, GFN2
    runmode: "inputfile"  # inputfile (read/write files on disk) or library (share data in memory)

  # ORCA settings (only used when type=orca)
  orca:
    orcasimpleinput: "! B97-3c"
    orcablocks: |
      %scf
        maxiter 200
      end
    moreadfile: null  # Optional: path to previous .gbw file for orbital guess

# NEB theory: Used for NEB/CI-NEB path search
# Can use a faster/cheaper method than main_theory
neb_theory:
  type: "xtb"   # xtb or orca
  numcores: 1
  printlevel: 1

  # xTB settings (only used when type=xtb)
  xtb:
    method: "GFN2"
    runmode: "inputfile"  # inputfile (read/write files on disk) or library (share data in memory)

  # ORCA settings (only used when type=orca)
  orca:
    orcasimpleinput: "! B97-3c"
    orcablocks: ""
    moreadfile: null

# ============================================================================
# NEB (CI-NEB/CINEB) settings
# ============================================================================
neb:
  images: 8  # Number of intermediate images
  maxiter: 200
  interpolation: "IDPP"  # IDPP or linear
  CI: true  # Climbing Image NEB (true/false)
  runmode: "serial"  # serial or parallel
  cores: 1  # Only used if runmode=parallel

# ============================================================================
# Optimization settings
# ============================================================================
optimization:
  maxiter: 200
  convergence_setting: "ORCA"  # ORCA, GAU, GAU_TIGHT, GAU_LOOSE, GAU_VERYTIGHT

# TS optimization settings
tsopt:
  maxiter: 200
  convergence_setting: "ORCA"
  hessian: "xtb"  # For xtb: "xtb"; For ORCA: "numerical" or leave empty for analytical

# ============================================================================
# Frequency calculation settings
# ============================================================================
frequency:
  method: "auto"  # auto (ORCA→AnFreq, xTB→NumFreq), numerical (NumFreq), analytical (AnFreq, ORCA only)
  npoint: 2  # 1 (faster) or 2 (more accurate) - only used for numerical
  runmode: "serial"  # serial or parallel - only used for numerical
  cores: 1  # only used for numerical
  imag_threshold: 20.0  # cm^-1, threshold for significant imaginary frequencies

# ============================================================================
# IRC settings
# ============================================================================
irc:
  maxiter: 200

# ============================================================================
# Endpoint Match (Stage 9) settings
# ============================================================================
# Molecular matching method for cross-isomorphism validation
# Available methods:
#   - smiles_openbabel: OpenBabel SMILES comparison (default)
#   - smiles_rdkit: RDKit SMILES comparison with multiple bond strategies
#   - graph_isomorphism: Pymatgen + NetworkX graph isomorphism
#   - rmsd: 3D RMSD structural comparison
#   - soap: SOAP descriptor similarity
endpoint_match:
  method: "smiles_openbabel"  # Choose matching method

  # smiles_openbabel config (no parameters needed)
  smiles_openbabel:

  # smiles_rdkit config
  smiles_rdkit:
    atom_map: false  # Include atom map numbers in SMILES (AAM) for tracking atoms
    all_hs_explicit: true  # true=explicit hydrogens, false=implicit hydrogens

  # graph_isomorphism config
  graph_isomorphism:
    local_env: "OpenBabelNN"  # Local environment strategy (OpenBabelNN, CovalentBondNN, MinimumDistanceNN)

  # rmsd config
  rmsd:
    threshold: 0.5         # RMSD threshold in Angstrom
    allow_reorder: false    # Allow atom reordering (Hungarian algorithm)
    heavy_only: false      # Compare only heavy atoms (ignore H)

  # soap config
  soap:
    r_cut: 6.0                      # Cutoff radius in Angstrom
    n_max: 8                        # Number of radial basis functions
    l_max: 6                        # Maximum angular momentum
    sigma: 1.0                      # Gaussian width
    kernel_metric: "linear"         # "linear" or "rbf" for AverageKernel
    kernel_gamma: null              # RBF gamma (null=auto, only for rbf metric)
    threshold_similarity: 0.995     # Similarity threshold for match

# ============================================================================
# Output settings
# ============================================================================
output:
  base_dir: "ash_xtb_smoketest_runs"
  printlevel: 1  # ASH printlevel for stages where supported
