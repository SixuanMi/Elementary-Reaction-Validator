# ASH xTB Workflow Configuration - High Accuracy Mode
# This config uses more rigorous settings for production calculations

inputs:
  reactant: "xyz/reactant.xyz"
  product: "xyz/product.xyz"
  ts_guess: "xyz/ts_ini.xyz"

system:
  charge: 0
  mult: 1

xtb:
  method: "GFN2"
  runmode: "inputfile"
  cores: 4  # Use more cores for faster calculation

neb:
  images: 11  # More images for better MEP resolution
  maxiter: 300  # More iterations for convergence
  interpolation: "IDPP"
  runmode: "serial"
  cores: 1

optimization:
  maxiter: 500  # More iterations for difficult cases
  convergence_setting: "GAU_TIGHT"

tsopt:
  maxiter: 500
  hessian: "xtb"

frequency:
  npoint: 2  # More accurate numerical frequencies
  runmode: "serial"
  cores: 1
  imag_threshold: 20.0

irc:
  maxiter: 500  # More steps for complete IRC path

output:
  base_dir: "ash_xtb_smoketest_runs"
  printlevel: 2  # More verbose output
